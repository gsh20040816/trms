services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TRMS_POSTGRES_DB}
      POSTGRES_USER: ${TRMS_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TRMS_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${TRMS_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${TRMS_MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      TRMS_MINIO_ROOT_USER: ${TRMS_MINIO_ROOT_USER}
      TRMS_MINIO_ROOT_PASSWORD: ${TRMS_MINIO_ROOT_PASSWORD}
      TRMS_STORAGE_S3_BUCKET: ${TRMS_STORAGE_S3_BUCKET}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set trms http://minio:9000 "$$TRMS_MINIO_ROOT_USER" "$$TRMS_MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "trms/$$TRMS_STORAGE_S3_BUCKET"
    restart: "no"

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TRMS_ENV: ${TRMS_ENV}
      TRMS_STORAGE_BACKEND: ${TRMS_STORAGE_BACKEND}
      TRMS_STORAGE_S3_ENDPOINT: ${TRMS_STORAGE_S3_ENDPOINT}
      TRMS_STORAGE_S3_BUCKET: ${TRMS_STORAGE_S3_BUCKET}
      TRMS_STORAGE_S3_ACCESS_KEY_ID: ${TRMS_STORAGE_S3_ACCESS_KEY_ID}
      TRMS_STORAGE_S3_SECRET_ACCESS_KEY: ${TRMS_STORAGE_S3_SECRET_ACCESS_KEY}
      TRMS_STORAGE_S3_REGION: ${TRMS_STORAGE_S3_REGION}
      TRMS_STORAGE_S3_KEY_PREFIX: ${TRMS_STORAGE_S3_KEY_PREFIX}
      TRMS_CORS_ALLOWED_ORIGINS: ${TRMS_CORS_ALLOWED_ORIGINS}
      TRMS_PUBLIC_API_BASE_URL: ${TRMS_PUBLIC_API_BASE_URL}
      TRMS_API_HOST: ${TRMS_API_HOST}
      TRMS_API_PORT: ${TRMS_API_PORT}
      TRMS_ASYNC_JOB_MODE: ${TRMS_ASYNC_JOB_MODE}
      TRMS_ASYNC_JOB_POLL_INTERVAL_SECONDS: ${TRMS_ASYNC_JOB_POLL_INTERVAL_SECONDS}
      TRMS_AUTH_ALLOW_ADMIN_SELF_REGISTER: ${TRMS_AUTH_ALLOW_ADMIN_SELF_REGISTER}
      TRMS_AUTH_BOOTSTRAP_ADMIN_TOKEN: ${TRMS_AUTH_BOOTSTRAP_ADMIN_TOKEN}
      TRMS_AUTH_TELEGRAM_INBOUND_TOKEN: ${TRMS_AUTH_TELEGRAM_INBOUND_TOKEN}
      TRMS_AUTH_EMAIL_INBOUND_TOKEN: ${TRMS_AUTH_EMAIL_INBOUND_TOKEN}
      TRMS_LLM_BASE_URL: ${TRMS_LLM_BASE_URL}
      TRMS_LLM_API_KEY: ${TRMS_LLM_API_KEY}
      TRMS_LLM_MODEL: ${TRMS_LLM_MODEL}
      TRMS_LLM_TIMEOUT_SECONDS: ${TRMS_LLM_TIMEOUT_SECONDS}
      TRMS_LLM_MAX_RETRIES: ${TRMS_LLM_MAX_RETRIES}
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TRMS_ENV: ${TRMS_ENV}
      TRMS_STORAGE_BACKEND: ${TRMS_STORAGE_BACKEND}
      TRMS_STORAGE_S3_ENDPOINT: ${TRMS_STORAGE_S3_ENDPOINT}
      TRMS_STORAGE_S3_BUCKET: ${TRMS_STORAGE_S3_BUCKET}
      TRMS_STORAGE_S3_ACCESS_KEY_ID: ${TRMS_STORAGE_S3_ACCESS_KEY_ID}
      TRMS_STORAGE_S3_SECRET_ACCESS_KEY: ${TRMS_STORAGE_S3_SECRET_ACCESS_KEY}
      TRMS_STORAGE_S3_REGION: ${TRMS_STORAGE_S3_REGION}
      TRMS_STORAGE_S3_KEY_PREFIX: ${TRMS_STORAGE_S3_KEY_PREFIX}
      TRMS_CORS_ALLOWED_ORIGINS: ${TRMS_CORS_ALLOWED_ORIGINS}
      TRMS_PUBLIC_API_BASE_URL: ${TRMS_PUBLIC_API_BASE_URL}
      TRMS_API_HOST: ${TRMS_API_HOST}
      TRMS_API_PORT: ${TRMS_API_PORT}
      TRMS_ASYNC_JOB_MODE: ${TRMS_ASYNC_JOB_MODE}
      TRMS_ASYNC_JOB_POLL_INTERVAL_SECONDS: ${TRMS_ASYNC_JOB_POLL_INTERVAL_SECONDS}
      TRMS_AUTH_ALLOW_ADMIN_SELF_REGISTER: ${TRMS_AUTH_ALLOW_ADMIN_SELF_REGISTER}
      TRMS_AUTH_BOOTSTRAP_ADMIN_TOKEN: ${TRMS_AUTH_BOOTSTRAP_ADMIN_TOKEN}
      TRMS_AUTH_TELEGRAM_INBOUND_TOKEN: ${TRMS_AUTH_TELEGRAM_INBOUND_TOKEN}
      TRMS_AUTH_EMAIL_INBOUND_TOKEN: ${TRMS_AUTH_EMAIL_INBOUND_TOKEN}
      TRMS_LLM_BASE_URL: ${TRMS_LLM_BASE_URL}
      TRMS_LLM_API_KEY: ${TRMS_LLM_API_KEY}
      TRMS_LLM_MODEL: ${TRMS_LLM_MODEL}
      TRMS_LLM_TIMEOUT_SECONDS: ${TRMS_LLM_TIMEOUT_SECONDS}
      TRMS_LLM_MAX_RETRIES: ${TRMS_LLM_MAX_RETRIES}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9876/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TRMS_ENV: ${TRMS_ENV}
      TRMS_STORAGE_BACKEND: ${TRMS_STORAGE_BACKEND}
      TRMS_STORAGE_S3_ENDPOINT: ${TRMS_STORAGE_S3_ENDPOINT}
      TRMS_STORAGE_S3_BUCKET: ${TRMS_STORAGE_S3_BUCKET}
      TRMS_STORAGE_S3_ACCESS_KEY_ID: ${TRMS_STORAGE_S3_ACCESS_KEY_ID}
      TRMS_STORAGE_S3_SECRET_ACCESS_KEY: ${TRMS_STORAGE_S3_SECRET_ACCESS_KEY}
      TRMS_STORAGE_S3_REGION: ${TRMS_STORAGE_S3_REGION}
      TRMS_STORAGE_S3_KEY_PREFIX: ${TRMS_STORAGE_S3_KEY_PREFIX}
      TRMS_CORS_ALLOWED_ORIGINS: ${TRMS_CORS_ALLOWED_ORIGINS}
      TRMS_PUBLIC_API_BASE_URL: ${TRMS_PUBLIC_API_BASE_URL}
      TRMS_API_HOST: ${TRMS_API_HOST}
      TRMS_API_PORT: ${TRMS_API_PORT}
      TRMS_ASYNC_JOB_MODE: ${TRMS_ASYNC_JOB_MODE}
      TRMS_ASYNC_JOB_POLL_INTERVAL_SECONDS: ${TRMS_ASYNC_JOB_POLL_INTERVAL_SECONDS}
      TRMS_AUTH_ALLOW_ADMIN_SELF_REGISTER: ${TRMS_AUTH_ALLOW_ADMIN_SELF_REGISTER}
      TRMS_AUTH_BOOTSTRAP_ADMIN_TOKEN: ${TRMS_AUTH_BOOTSTRAP_ADMIN_TOKEN}
      TRMS_AUTH_TELEGRAM_INBOUND_TOKEN: ${TRMS_AUTH_TELEGRAM_INBOUND_TOKEN}
      TRMS_AUTH_EMAIL_INBOUND_TOKEN: ${TRMS_AUTH_EMAIL_INBOUND_TOKEN}
      TRMS_LLM_BASE_URL: ${TRMS_LLM_BASE_URL}
      TRMS_LLM_API_KEY: ${TRMS_LLM_API_KEY}
      TRMS_LLM_MODEL: ${TRMS_LLM_MODEL}
      TRMS_LLM_TIMEOUT_SECONDS: ${TRMS_LLM_TIMEOUT_SECONDS}
      TRMS_LLM_MAX_RETRIES: ${TRMS_LLM_MAX_RETRIES}
    command: ["python", "-m", "trms_backend", "worker"]

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  reverse-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "${TRMS_PUBLIC_HTTP_PORT}:80"
    volumes:
      - ./reverse-proxy.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  minio-data:
