[project]
name = "trms"
version = "0.1.0"
description = "Tongji ACM reimbursement material collection system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "boto3>=1.39.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pypdf>=5.5.0",
    "pydantic>=2.10.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
